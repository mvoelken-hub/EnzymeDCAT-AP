---
id: https://w3id.org/mvoelken-hub/EnzymeDCAT-AP
name: EnzymeDCAT-AP
title: EnzymeDCAT-AP
description: |-
  This is an extension of the DCAT-AP Plus LinkML schema to provide biocatalytic specific metadata for a dataset.
license: MIT
see_also:
  - https://mvoelken-hub.github.io/EnzymeDCAT-AP

prefixes:
  enzymedcat_ap: https://w3id.org/mvoelken-hub/EnzymeDCAT-AP/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
  # Declared by DCAT-AP+ only in its own file. LinkML freezes its namespace map while DCAT-AP+ is still being
  # loaded, so without this line elements without a URI get the invalid IRIs dcatap_plus:... and gen-shacl
  # falls back to a canonicalisation that does not finish.
  dcatap_plus: https://w3id.org/nfdi-de/dcat-ap-plus/

default_prefix: enzymedcat_ap
default_range: string

imports:
  - linkml:types
  - EnzymeML_DCAT_AP/enzymemldcat_ap
  #- StrendaBiocatalysis_DCAT_AP/strendabiocatdcat_ap

classes:

slots:

