---
id: https://w3id.org/mvoelken-hub/EnzymeDCAT-AP/enzymeml
name: EnzymeML-DCAT-AP
title: EnzymeML DCAT-AP Profile
description: |-
  This is the EnzymeML profile of EnzymeDCAT-AP, an extension of the DCAT-AP Plus LinkML schema to provide biocatalytic specific metadata for a dataset.
license: MIT
see_also:
  - https://mvoelken-hub.github.io/EnzymeDCAT-AP

prefixes:
  enzymedcat_ap: https://w3id.org/mvoelken-hub/EnzymeDCAT-AP/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
  SIO: http://semanticscience.org/resource/SIO_
  prov: http://www.w3.org/ns/prov#
  RO: http://purl.obolibrary.org/obo/RO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  IAO: http://purl.obolibrary.org/obo/IAO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  BFO: http://purl.obolibrary.org/obo/BFO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  AFE: http://purl.allotrope.org/ontologies/equipment#AFE_
  EDAM: http://edamontology.org/data_
  dcatap_plus: https://w3id.org/nfdi-de/dcat-ap-plus/  # see enzymedcat_ap.yaml
default_prefix: enzymedcat_ap
default_range: string

imports:
  - linkml:types
  - ../chem_dcat_ap

classes:
  EnzymeMLDocument:
      is_a: Dataset
      description: >-
        A Dataset that represents a converted EnzymeML document: a container
        for a biocatalytic experiment's vessels, species, reactions,
        measurements and kinetic model, expressed as DCAT-AP+ metadata.
      slot_usage:
        was_generated_by:
          description: >-
            The BiocatalyticExperiment that this EnzymeML document describes.
          range: BiocatalyticExperiment
          required: true
          multivalued: true
          inlined_as_list: true
        is_about_activity:
          description: >-
            The BiocatalyticReaction(s) this EnzymeML document is about. An
            EnzymeML document may hold more than one reaction, therefore
            multivalued (unlike the single-valued base in
            ReactionMonitoringDataset).
          range: BiocatalyticReaction
          multivalued: true
          inlined_as_list: true
          recommended: true
        creator:
          description: >-
            The author(s)/contributor(s) of the EnzymeML document. Not
            required: many real-world EnzymeML documents carry no creator
            metadata, and the converter cannot fabricate it.
          range: EnzymeMLCreator
          recommended: true
          multivalued: true
          inlined_as_list: true

  EnzymeMLCreator:
    is_a: Agent
    class_uri: schema:person
    description: >-
      An author or contributor of an EnzymeML document, with the
      given/family name split and email address EnzymeML captures.
    slots:
      - given_name
      - family_name
      - mail

  BiocatalyticReaction:
    is_a: ChemicalReaction
    class_uri: SIO:010345
    description: >-
      A ChemicalReaction that is catalyzed by a Biocatalyst (enzyme or whole
      cell). Evaluated by a BiocatalyticExperiment. Carries the kinetic model
      (equations and parameters) and the reversibility of an EnzymeML Reaction.
    slots:
      - has_kinetic_equation
      - has_kinetic_model_parameter
      - is_reversible

  # =============================================================================
  # BIOCATALYTIC EXPERIMENT (top-level DataGeneratingActivity of an EnzymeML
  # document; target of EnzymeMLDocument.was_generated_by)
  # =============================================================================

  BiocatalyticExperiment:
    is_a: DataGeneratingActivity
    class_uri: OBI:0000066
    aliases:
      - BiocatalyticInvestigation
    description: >-
      A DataGeneratingActivity representing the biocatalytic experiment
      described by an EnzymeML document. The BiocatalyticReaction(s) are the
      evaluated activities; the vessels, species (biocatalysts, components,
      complexes) and measurements of the document attach to this class.
    slots:
      - used_biocatalyst
      - has_biocatalytic_component
      - has_molecular_complex
      - used_reaction_vessel
      - has_enzyme_measurement
    slot_usage:
      evaluated_activity:
        description: >-
          The BiocatalyticReaction(s) that this experiment evaluates. An
          EnzymeML document may hold more than one reaction, therefore
          multivalued.
        range: BiocatalyticReaction
        multivalued: true
        inlined_as_list: true
      occurred_in:
        description: The Laboratory in which the experiment took place.
        range: Laboratory
      carried_out_by:
        description: The AgenticEntities that carried out the experiment.

  # =============================================================================
  # SPECIES (EnzymeML Protein, SmallMolecule and Complex)
  # =============================================================================

  Biocatalyst:
    is_a: MaterialEntity
    description: >-
      An enzyme or cell that catalyzes a biocatalytic reaction (EnzymeML
      Protein). Subclass of MaterialEntity. Its role as the catalyst of a
      specific BiocatalyticReaction is described by a Catalyst wrapper via
      used_catalyst.
    todos:
      - >-
        Find a suitable ontology term for class_uri. The BioDCAT mapping
        CHEBI:35233 is 'tungsten coordination entity' in ChEBI.
    slots:
      - has_constant_concentration
      - sequence_amino_acid
      - ec_number
      - origin_organism
      - organism_taxonomy_id
    slot_usage:
      title:
        description: >-
          The name of the biocatalyst, either generic (e.g. 'lipase') or
          specific (genus and species, e.g. 'Candida antarctica lipase B').
        required: true
      other_identifier:
        description: >-
          Identifiers for the biocatalyst such as UniProt accession,
          EC number reference, or other database identifiers.

  BiocatalyticComponent:
    is_a: ChemicalEntity
    class_uri: CHEBI:59999
    description: >-
      A ChemicalSubstance present in the reaction mixture of a biocatalytic
      experiment, regardless of its functional role (EnzymeML SmallMolecule).
      Role differentiation (EnzymeML ModifierRole) is optional.
    slots:
      - has_component_role
      - has_constant_concentration
      - synonymous_names
    slot_usage:
      other_identifier:
        description: >-
          One or more persistent identifiers for the component such as CAS
          number, PubChem CID, InChI, or similar database identifiers.

  MolecularComplex:
    is_a: ChemicalEntity
    class_uri: NCIT:C19398
    description: >-
      A grouping of two or more species (SmallMolecule/BiocatalyticComponent
      and/or Biocatalyst) into a single complex, e.g. an enzyme-substrate
      complex or a buffer/solvent mixture (EnzymeML Complex).
    slots:
      - has_constant_concentration
      - has_complex_participant
    slot_usage:
      has_part:
        description: >-
          Nested ChemicalEntity-branch participants of this complex (inherited
          from ChemicalEntity; use has_complex_participant instead when a
          Biocatalyst/enzyme is one of the participants).
        range: ChemicalEntity

  # =============================================================================
  # REACTION VESSEL (EnzymeML Vessel)
  # =============================================================================

  ReactionVessel:
    is_a: Reactor
    class_uri: AFE:0000153
    description: >-
      A reactor is a container for controlling a biological or chemical
      reaction or process (EnzymeML Vessel). [Allotrope]
    slots:
      - has_constant_volume

  # =============================================================================
  # KINETIC MODEL (EnzymeML Equation, Variable and Parameter)
  # =============================================================================

  KineticEquation:
    is_a: QualitativeAttribute
    description: >-
      A mathematical equation used to model part of a BiocatalyticReaction's
      kinetics (EnzymeML Equation). The equation expression itself is stored
      in the inherited "value" slot.
    slots:
      - equation_species_reference
      - equation_type
      - has_equation_variable

  EquationVariable:
    is_a: QualitativeAttribute
    class_uri: IAO:0000028
    description: >-
      A symbolic variable used inside a KineticEquation's expression
      (EnzymeML Variable). The variable's symbol is stored in the inherited
      "value" slot, its human-readable name in the inherited "title" slot.

  KineticModelParameter:
    is_a: QuantitativeAttribute
    description: >-
      An estimated or fixed parameter of a kinetic model, such as a rate or
      binding constant (EnzymeML Parameter).
    slots:
      - parameter_symbol
      - initial_value
      - upper_bound
      - lower_bound
      - stderr
      - is_fitted
      - is_fixed_parameter
    slot_usage:
      value:
        description: >-
          The estimated value of the parameter. Optional here (unlike the
          base QuantitativeAttribute), because a parameter may not yet have
          been fitted.
        required: false

  # =============================================================================
  # MEASUREMENTS (EnzymeML Measurement and MeasurementData)
  # =============================================================================

  PlannedProcess:
    class_uri: OBI:0000011
    is_a: EvaluatedActivity
    description: >-
      A process that realizes a plan - i.e. it is carried out with the
      intention of achieving a specified objective. (OBI:0000011 stub)

  MeasurementProcess:
    class_uri: OBI:0000070
    is_a: PlannedProcess
    description: >-
      A planned process that has the objective to produce information about
      a material entity by examining it. (OBI:0000070 stub)

  EnzymeMeasurement:
    is_a: MeasurementProcess
    description: >-
      A single measurement/experimental run within an EnzymeML document,
      grouping time-course data for all observed species (EnzymeML
      Measurement).
    slots:
      - measurement_group_id
      - has_measurement_species_data
      - has_ph_value
      - has_temperature
    slot_usage:
      has_ph_value:
        description: The pH at which this measurement was recorded.
      has_temperature:
        description: The temperature at which this measurement was recorded.

  EnzymeMeasurementSpeciesData:
    is_a: QuantitativeAttribute
    class_uri: IAO:0000584
    description: >-
      Time-course measurement data for a single species within an
      EnzymeMeasurement (EnzymeML MeasurementData). "value" (inherited) is
      not used directly here -- see has_timepoint for the actual series.
    slots:
      - measured_species_reference
      - prepared_amount
      - initial_amount
      - measurement_data_type
      - is_simulated
      - has_timepoint
    slot_usage:
      value:
        required: false

  MeasurementTimepoint:
    is_a: QuantitativeAttribute
    description: >-
      A single (time, value) pair within a time-course measurement
      (EnzymeML MeasurementData data and time).
    slots:
      - has_time_value
      - time_unit

slots:
  given_name:
    slot_uri: schema:givenName
    is_a: has_qualitative_attribute
    range: string
    description: Given name of a document creator/contributor.

  family_name:
    slot_uri: schema:familyName
    is_a: has_qualitative_attribute
    range: string
    description: Family name of a document creator/contributor.

  mail:
    slot_uri: schema:email
    is_a: has_qualitative_attribute
    range: string
    description: Email address of a document creator/contributor.

  # --- Experiment slots ---

  used_biocatalyst:
    slot_uri: prov:used
    is_a: had_input_entity
    range: Biocatalyst
    multivalued: true
    inlined_as_list: true
    description: >-
      The Biocatalysts (EnzymeML Proteins) used in the experiment.
    recommended: true

  has_biocatalytic_component:
    slot_uri: prov:used
    is_a: had_input_entity
    range: BiocatalyticComponent
    multivalued: true
    inlined_as_list: true
    description: >-
      The chemical components present in the reaction mixture.
    recommended: true

  has_molecular_complex:
    slot_uri: prov:used
    is_a: had_input_entity
    range: MolecularComplex
    multivalued: true
    inlined_as_list: true
    description: >-
      MolecularComplex groupings (e.g. enzyme-substrate complexes) present
      in the reaction mixture of the BiocatalyticExperiment (EnzymeML
      Complex pool). Kept separate from has_biocatalytic_component because
      MolecularComplex is not a BiocatalyticComponent.

  used_reaction_vessel:
    slot_uri: prov:wasAssociatedWith
    is_a: carried_out_by
    range: ReactionVessel
    description: >-
      The reaction vessel in which the biocatalytic reaction took place.
    recommended: true

  has_enzyme_measurement:
    slot_uri: BFO:0000051
    is_a: has_part
    range: EnzymeMeasurement
    multivalued: true
    inlined_as_list: true
    description: >-
      Measurement runs (time-course data collection events) carried out
      during the BiocatalyticExperiment (EnzymeML Measurement pool).

  # --- Biocatalyst slots ---

  sequence_amino_acid:
    slot_uri: SIO:010015
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The amino acid sequence of the biocatalyst (a protein sequence is a
      symbolic sequence of amino acid residues in a protein).

  ec_number:
    slot_uri: EDAM:1011
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The Enzyme Commission (EC) number of the biocatalyst, e.g. 3.1.1.3.

  origin_organism:
    slot_uri: OBI:0100026
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The organism of the biocatalyst: in EnzymeML the expression host
      organism of the protein, in general the genus and species of the
      organism from which the biocatalyst is derived or isolated.

  organism_taxonomy_id:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      A taxonomy database identifier (e.g. NCBI Taxonomy ID) for the
      organism named in origin_organism.

  # --- Slot shared by Biocatalyst, BiocatalyticComponent and MolecularComplex ---

  has_constant_concentration:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether the concentration of this biocatalyst/component/complex is
      treated as constant throughout the experiment (EnzymeML "constant" on
      Protein/Complex/SmallMolecule). Distinct from a vessel's volume being
      constant -- see has_constant_volume on ReactionVessel, and distinct
      from a KineticModelParameter being fixed -- see is_fixed_parameter.

  # --- BiocatalyticComponent slots ---

  has_component_role:
    slot_uri: RO:0000087
    range: ComponentRoleEnum
    description: >-
      The functional role of this component in the biocatalytic reaction
      (EnzymeML ModifierRole). Optional - a structural converter may leave
      this unpopulated; a smarter converter or human annotator populates it
      from CHEBI roles.
    recommended: true

  synonymous_names:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    multivalued: true
    description: >-
      Alternative names by which this component is also known (EnzymeML
      SmallMolecule "synonymous_names").

  # --- MolecularComplex slots ---

  has_complex_participant:
    slot_uri: BFO:0000051
    is_a: has_part
    description: >-
      A participant of a MolecularComplex. Covers both the ChemicalEntity
      branch (SmallMolecule/BiocatalyticComponent/nested MolecularComplex)
      and the MaterialEntity branch (Biocatalyst), which is why any_of is
      used instead of a single range.
    range: ChemicalEntity
    multivalued: true
    inlined_as_list: true
    any_of:
      - range: ChemicalEntity
      - range: Biocatalyst

  # --- ReactionVessel slots ---

  has_constant_volume:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether the volume of a vessel is treated as constant throughout the
      experiment (EnzymeML Vessel "constant").

  # --- Reaction and kinetic model slots ---

  is_reversible:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether the reaction is reversible (EnzymeML Reaction "reversible").

  has_kinetic_equation:
    slot_uri: BFO:0000051
    is_a: has_part
    range: KineticEquation
    multivalued: true
    inlined_as_list: true
    description: >-
      Kinetic model equation(s) describing this BiocatalyticReaction,
      including but not limited to its rate law (EnzymeML Reaction
      kinetic_law and the document-level equations pool).

  has_kinetic_model_parameter:
    slot_uri: BFO:0000051
    is_a: has_part
    range: KineticModelParameter
    multivalued: true
    inlined_as_list: true
    description: >-
      Estimated or fixed kinetic model parameters associated with this
      BiocatalyticReaction (EnzymeML Parameter pool, referenced by symbol
      from KineticEquation expressions).

  equation_species_reference:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Reference (id or name) of the species this equation's left-hand side
      refers to. Kept as a plain string deliberately, since the referenced
      species may be a Biocatalyst, BiocatalyticComponent or
      MolecularComplex (three different, incompatible class branches) --
      resolving this into a typed link is left to the converter.

  equation_type:
    slot_uri: RO:0000086
    range: KineticEquationTypeEnum
    description: The role this KineticEquation plays within the kinetic model.

  has_equation_variable:
    slot_uri: BFO:0000051
    is_a: has_part
    range: EquationVariable
    multivalued: true
    inlined_as_list: true
    description: The variables that appear in this KineticEquation's expression.

  parameter_symbol:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: The symbol used for this parameter in kinetic equations (e.g. "Km").

  initial_value:
    slot_uri: RO:0000086
    range: float
    description: >-
      The initial value used for this parameter before optimization/fitting.
      Assumed to share the same unit as the parameter's own value.

  upper_bound:
    slot_uri: RO:0000086
    range: float
    description: >-
      The upper bound used for this parameter during optimization/fitting.

  lower_bound:
    slot_uri: RO:0000086
    range: float
    description: >-
      The lower bound used for this parameter during optimization/fitting.

  stderr:
    slot_uri: RO:0000086
    range: float
    description: The standard error of the estimated parameter value.

  is_fitted:
    slot_uri: RO:0000086
    range: boolean
    description: Whether this parameter was varied during optimization/fitting.

  is_fixed_parameter:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether this parameter is treated as fixed/constant rather than
      estimated (EnzymeML Parameter "constant"). Distinct from is_fitted:
      EnzymeML keeps both fields independently, so both are carried through
      as-is rather than collapsed into one.

  # --- Measurement slots ---

  measurement_group_id:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      User-defined identifier linking together several EnzymeMeasurements
      that belong to the same experimental series.

  has_measurement_species_data:
    slot_uri: BFO:0000051
    is_a: has_part
    range: EnzymeMeasurementSpeciesData
    multivalued: true
    inlined_as_list: true
    description: Per-species time-course data recorded within this measurement.

  measured_species_reference:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Reference (id or name) of the measured species. Kept as a plain string
      for the same reason as equation_species_reference above.

  prepared_amount:
    slot_uri: RO:0000086
    range: float
    description: >-
      The amount of the species present before the measurement started
      (EnzymeML MeasurementData "prepared").

  initial_amount:
    slot_uri: RO:0000086
    range: float
    description: >-
      The amount of the species at the first recorded data point (EnzymeML
      MeasurementData "initial").

  measurement_data_type:
    slot_uri: RO:0000086
    range: MeasurementDataTypeEnum
    description: The physical/analytical nature of the recorded data series.

  is_simulated:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether this data series was generated by simulation rather than
      measured.

  has_timepoint:
    slot_uri: BFO:0000051
    is_a: has_part
    range: MeasurementTimepoint
    multivalued: true
    inlined_as_list: true
    description: The individual (time, value) data points of this series.

  has_time_value:
    slot_uri: RO:0000086
    is_a: has_quantitative_attribute
    range: float
    description: A time value as a numeric quantity.

  time_unit:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: Unit for a time value (s, min, h).

enums:
  ComponentRoleEnum:
    description: >-
      The functional role of a chemical component in a biocatalytic reaction
      (EnzymeML ModifierRole). Maps to CHEBI role hierarchy. Optional - a
      structural converter may leave this unpopulated. The EnzymeML role
      BIOCATALYST is not a component role: the biocatalyst itself is
      described via used_catalyst.
    permissible_values:
      Buffer:
        meaning: CHEBI:35225
      Activator:
        description: >-
          A substance that increases the rate or extent of a biocatalytic
          reaction without being consumed (EnzymeML ModifierRole ACTIVATOR).
      Inhibitor:
        description: >-
          A substance that decreases the rate or extent of a biocatalytic
          reaction (EnzymeML ModifierRole INHIBITOR).
      Solvent:
        description: >-
          The primary liquid a reaction is carried out in (EnzymeML
          ModifierRole SOLVENT).
      AuxiliaryCatalyst:
        description: >-
          A non-biological catalyst present alongside or instead of the
          Biocatalyst (EnzymeML ModifierRole CATALYST, if no biocatalyst is
          meant -- the biocatalyst itself is described via used_catalyst,
          not via this role).
      Other:
        description: >-
          Any other modifier (EnzymeML ModifierRole ADDITIVE).

  KineticEquationTypeEnum:
    description: >-
      The role a KineticEquation plays within a kinetic model (EnzymeML
      EquationType).
    permissible_values:
      Assignment:
        description: A variable is directly assigned the result of the equation.
      InitialAssignment:
        description: >-
          The equation sets the initial value of a variable before
          simulation/integration starts.
      ODE:
        description: >-
          The equation is an ordinary differential equation describing the
          rate of change of a species or variable over time.
      RateLaw:
        description: >-
          The equation describes the rate law of a BiocatalyticReaction
          (e.g. Michaelis-Menten kinetics).

  MeasurementDataTypeEnum:
    description: >-
      The physical/analytical nature of a raw measurement data series
      (EnzymeML DataTypes).
    permissible_values:
      Absorbance:
      Amount:
      Concentration:
      Conversion:
      Fluorescence:
      PeakArea:
      Transmittance:
      Turnover:
      Yield:
