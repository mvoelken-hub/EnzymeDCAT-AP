---
id: https://w3id.org/mvoelken-hub/EnzymeDCAT-AP/strenda
name: STRENDA-Biocatalysis-DCAT-AP
title: STRENDA Biocatalysis DCAT-AP Profile
description: |-
  This is the STRENDA Biocatalysis profile of EnzymeDCAT-AP, an extension of the DCAT-AP Plus LinkML schema to provide biocatalytic specific metadata for a dataset.
license: MIT
see_also:
  - https://mvoelken-hub.github.io/EnzymeDCAT-AP

prefixes:
  enzymedcat_ap: https://w3id.org/mvoelken-hub/EnzymeDCAT-AP/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
  AFE: http://purl.allotrope.org/ontologies/equipment#AFE_ 
default_prefix: enzymedcat_ap
default_range: string

imports:
  - linkml:types
  - ../chem_dcat_ap


classes:

  # Biocatalyst
  BiocatalystPurchased:
    is_a: #todo Marc
    class_uri: # No results!
    description: "Important information to characterize the biocatalyst and determine its origin.Biocatalyst self-produced"
    slots:
      - has_name
      - has_ec_number
      - has_molecular_weight
      - has_molecular_weight_unit
      - has_catalyzed_reaction
      - has_sequence_amino_acid
      - has_sequence_DNA
      - has_origin_organism
      - has_supplier
      - has_production_organism
      - has_posttranslational_modification
      - has_purity
      - has_purity_specification
      - has_formulation
  BiocatalystSelfProduced:
    is_a: #todo Marc
    class_uri:
    description: "Important information to characterize the biocatalyst and to describe it clearly."
    slots:
      - has_name
      - has_ec_number
      - has_molecular_weight
      - has_molecular_weight_unit
      - has_catalyzed_reaction
      - has_sequence_amino_acid
      - has_sequence_DNA
      - has_sequence_plasmid
      - has_plasmid_specifications
      - has_origin_organism
      - has_production_organism
      - has_posttranslational_modification
      - has_purity
      - has_purity_specification
      - has_purification_method
      - has_formulation
      - has_special_treatment
  CellFreeProduction:
    is_a: #todo Marc
    class_uri:
    description: "Cell-free enzyme production or gene expression refers to a process where the synthesis of the biocatalyst occurs outside of living cells. This technique involves extracting cellular components, such as ribosomes, DNA, RNA, and other necessary cellular machinery, and using them in a controlled environment (usually in vitro) to produce proteins or enzymes. For further information see, e.g. Khambhati _et al._1."
    slots:
      - has_source_of_cellfree_extract
      - has_concentration
      - has_concentration_unit
      - has_concentration_determination_method
      - has_special_treatment
  CrudeCellExtract:
    is_a: #todo Marc
    class_uri:
    description: "Whole cell biocatalyst"
    slots:
      - has_cell_disruption_process
      - has_concentration
      - has_concentration_unit
      - has_concentration_determination_method
      - has_special_treatment
  Immobilised:
    is_a: #todo Marc
    class_uri:
    description: ""
    slots:
      - has_biocatalyst
      - has_immobilisation_chemistry
      - has_carrier_material
      - has_linkers
      - has_immobilisation_method
      - has_purification_method
      - has_concentration
      - has_concentration_unit
      - has_concentration_determination_method
      - has_special_treatment
  PurifiedBiocatalyst:
    is_a: #todo Marc
    class_uri:
    description: "The soluble enzyme refers to purified enzyme.Crude cell extract"
    slots:
      - has_concentration
      - has_concentration_unit
      - has_concentration_determination_method
      - has_activity
      - has_activity_unit
      - has_activity_determination_method
      - has_formulation
      - has_special_treatment
  SecretedEnzyme:
    is_a: #todo Marc
    class_uri:
    description: "Cell-free-production"
    slots:
      - has_separation_method
      - has_concentration
      - has_concentration_unit
      - has_concentration_determination_method
      - has_special_treatment
  StorageConditions:
    is_a: #todo Marc
    class_uri:
    description: ""
    slots:
      - has_temperature
      - has_temperature_unit
      - has_storage_start
      - has_additives
      - has_drying_method
      - has_special_treatment
  WholeCellBiocatalyst:
    is_a: #todo Marc
    class_uri:
    description: "Secreted enzyme"
    slots:
      - has_harvesting_method
      - has_concentration
      - has_concentration_unit
      - has_concentration_determination_method
      - has_formulation
      - has_special_treatment

  # Components
  Components:
    is_a: #todo Marc
    class_uri:
    description: "Each component present in the planned reaction must be defined."
    slots:
      - has_name
      - has_smiles
      - has_persistent_identifier_PID
      - has_concentration
      - has_concentration_unit
      - has_supplier
      - has_purity
      - has_formulation
      - has_solubility_limit
      - has_solubility_limit_unit
  ComponentsStorageConditions:
    is_a: #todo Marc
    class_uri:
    description: ""
    slots:
      - has_temperature
      - has_temperature_unit
      - has_storage_start
      - has_additives
      - has_special_treatment

  # Operation Mode
  Batch:
    is_a: #todo Marc
    class_uri:
    description: "The batch operation mode represents a fundamental approach in biocatalysis, where all reaction components are mixed simultaneously within a closed system, and the reaction proceeds until a predetermined endpoint is reached. This mode is easy to control and well-suited for producing small batches of products."
    slots:
      - has_reactor_type
  CombinatorialMode:
    is_a: #todo Marc
    class_uri:
    description: "A combinatorial mode does not clearly fit into any of the aforementioned subcategories and thus represents a mixture of operation modes. This kind of experiment design could be used to systematically explore various reaction conditions or components in a combined manner. This approach allows the exploration of multiple options, such as varying substrate concentrations, catalysts, or reaction conditions. The goal is to identify the optimal conditions or combinations that most efficiently facilitate desired reactions in biocatalysis."
    slots:
      - has_reactor_type
  Continuous:
    is_a: #todo Marc
    class_uri:
    description: "In the continuous operation mode, the reaction operates continuously with substrates continuously supplied and products continuously removed. This mode enables uniform product formation and is particularly suitable for large-scale production."
    slots:
      - has_reactor_type
  FedBatch:
    is_a: #todo Marc
    class_uri:
    description: "In the fed-batch operation mode, additional compounds (e.g., substrates, acid/base for pH regulation, etc.) are gradually added during the reaction to control reaction conditions or enhance product formation. This mode allows for better control of the reaction progress and can increase productivity."
    slots:
      - has_reactor_type

  # Reaction Conditions
  DynamicTemperature_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "If there is a temperature gradient or different temperatures are measured in the system, these must be described as well as possible."
    slots:
      - has_temperature_beginning
      - has_temperature_after_event
      - has_event_description
      - has_temperature_at_XY
      - has_time_at_XY
      - has_time_unit
      - has_temperature_unit
      - has_temperature_gradient_beginning
      - has_temperature_gradient_end
      - has_gradient_length
      - has_gradient_length_unit
      - has_measurement_points
      - has_special_treatment
  DynamicpH_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "If there is a pH gradient or different pHs are measured in the system, these must be described as detailed as possible. Depending on the buffer chosen, a temperature shift may also result in a pH shift."
    slots:
      - has_pH_beginning
      - has_pH_after_event
      - has_event_description
      - has_pH_at_XY
      - has_time_at_XY
      - has_time_unit
      - has_detected_when
      - has_detected_how
      - has_temperature
      - has_temperature_unit
      - has_calibration_pH_electrode
      - has_pH_gradient_beginning
      - has_pH_gradient_end
      - has_gradient_length
      - has_gradient_length_unit
      - has_measurement_points
      - has_special_treatment
  EventBasedTemperatureShift_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "If the temperature is changed during the course of the reaction or there is an event-based change, this must be documented precisely."
    slots:
      - has_temperature_unit
      - has_temperature_beginning
      - has_temperature_after_event
      - has_event_description
      - has_temperature_at_XY
      - has_time_at_XY
      - has_time_unit
      - has_special_treatment
  EventBasedpHShift_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "If the pH is changed during the course of the reaction or there is an event-based change, this must be documented precisely. Depending on the buffer chosen, a temperature shift may also result in a pH shift."
    slots:
      - has_pH_beginning
      - has_pH_after_event
      - has_event_description
      - has_pH_at_XY
      - has_time_at_XY
      - has_time_unit
      - has_detected_when
      - has_detected_how
      - has_temperature
      - has_temperature_unit
      - has_calibration_pH_electrode
      - has_special_treatment
  GasPhase_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "Definition of the gas phase used in the reaction. If a gas mixture is involved, this must be taken into account."
    slots:
      - has_gas_type
      - has_gas_amount
      - has_gas_unit
  GasPhase_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "Definition of the gas phase used in the reaction. If a gas mixture is involved, this must be taken into account."
    slots:
      - has_gas_type
      - has_gas_amount
      - has_gas_unit
  LiquidPhase_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "If more then one liquid phase exists the metadata has to be recorded according to the number of liquid phases.Solid phase"
    slots:
      - has_liquid_type
      - has_liquid_amount
      - has_liquid_unit
  LiquidPhase_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "If more then one liquid phase exists the metadata has to be recorded according to the number of liquid phases.Solid phase"
    slots:
      - has_liquid_type
      - has_liquid_amount
      - has_liquid_unit
  MonoliquidSystemDescription_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "To describe a monoliquid system, precise information about the solvent used and the applied system must be provided."
    slots:
      - has_solvent_description
      - has_ionic_strength
      - has_ionic_strength_unit
      - has_further_additives
      - has_Flow_rate
      - has_Flow_rate_unit
      - has_special_treatment
  MonoliquidSystemDescription_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "To describe a monoliquid system, precise information about the solvent (mixture) used and the applied reaction system must be provided."
    slots:
      - has_solvent_description
      - has_ionic_strength
      - has_ionic_strength_unit
      - has_further_additives
      - has_special_treatment
  MultiphasicSystemDescription_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "To describe a multiphasic system, precise information about the phases used and the applied system must be provided."
    slots:
      - has_phases_number
      - has_Flow_rate
      - has_Flow_rate_unit
      - has_special_treatment
  MultiphasicSystemDescription_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "To describe a multiphasic system, precise information about the phases used and the applied system must be provided."
    slots:
      - has_phases_number
      - has_special_treatment
  SolidPhase_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "Definition of the solid phase used in the reaction.Gas phase"
    slots:
      - has_solid_type
      - has_solid_amount
      - has_solid_unit
  SolidPhase_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "Definition of the solid phase used in the reaction.Gas phase"
    slots:
      - has_solid_type
      - has_solid_amount
      - has_solid_unit
  TemperatureConstant_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "The temperature, if constant, must be clearly defined.Dynamic temperature"
    slots:
      - has_temperature
      - has_temperature_unit
      - has_special_treatment
  TemperatureConstant_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "The temperature, if constant, must be clearly defined.Event-based temperature shift"
    slots:
      - has_temperature
      - has_temperature_unit
      - has_special_treatment
  pHConstant_TFCR:
    is_a: #todo Marc
    class_uri:
    description: "Information about the pH value in the system, if the pH is constant over the course of the reaction.Dynamic pH"
    slots:
      - has_pH_value
      - has_detected_when
      - has_detected_how
      - has_temperature
      - has_temperature_unit
      - has_calibration_pH_electrode
      - has_special_treatment
  pHConstant_WMRS:
    is_a: #todo Marc
    class_uri:
    description: "Information about the pH value in the system, if the pH is constant over the course of the reaction.Event-based pH shift"
    slots:
      - has_pH_value
      - has_detected_when
      - has_detected_how
      - has_temperature
      - has_temperature_unit
      - has_calibration_pH_electrode
      - has_special_treatment

  # Results
  ActivityAndInitialReactionRate:
    is_a: #todo Marc
    class_uri:
    description: ""
    slots:
      - has_specific_activity
      - has_specific_activity_unit
      - has_initial_reaction_rate
      - has_initial_reaction_rate_unit
      - has_special_treatment
  KineticParameters:
    is_a: #todo Marc
    class_uri:
    description: "These parameters serve as benchmarks for understanding enzyme kinetics. The Km and kcat value is determined by all substrates involved in the reaction and not just one. Therefore, the concentrations of all substrates must be varied and the Km and kcat values calculated to obtain a common value instead of apparent values. For a comprehensive report around the technical key data of the kinetic parameters, see literature for further information, e.g. Pesci _et al._1, Bisswanger 2 ."
    slots:
      - has_michaelis_constant
      - has_michaelis_constant_unit
      - has_maximum_reaction_rate
      - has_maximum_reaction_rate_unit
      - has_turnover_number
      - has_turnover_number_unit
      - has_catalytic_efficiency
      - has_catalytic_efficiency_unit
      - has_dissociation_constant
      - has_dissociation_constant_unit
      - has_inhibition_type
      - has_inhibition_constant
      - has_inhibition_constant_unit
      - has_hill_coefficient
      - has_enzyme_stability
      - has_special_treatment
  SelectivityAndSpecificity:
    is_a: #todo Marc
    class_uri:
    description: "These parameters directly assess a catalyst's precision in converting specific substrates to desired products. For a comprehensive report around the technical key data of the selectivity and specificity, see literature for further information, e.g. Faber4, Liese _et al._3, Schurig5."
    slots:
      - has_stereoselectivity
      - has_enantioselectivity
      - has_enantiomeric_excess
      - has_enantiomeric_excess_unit
      - has_diastereomeric_excess
      - has_diasteriomeric_excess_unit
      - has_isomeric_content
      - has_isomeric_content_unit
      - has_chemoselectivity
      - has_regioselectivity
      - has_special_treatment
  ThermodynamicParameters:
    is_a: #todo Marc
    class_uri:
    description: "Understanding the energy dynamics and spontaneity of reactions through thermodynamic parameters is essential for efficient biocatalysis. For a comprehensive report around the technical key data of the kinetic parameters, see literature for further information, e.g. Heintz6."
    slots:
      - has_gibbs_free_energy_change
      - has_enthalpy_change
      - has_special_treatment
  YieldAndConversion:
    is_a: #todo Marc
    class_uri:
    description: "These metrics are vital for evaluating the success of a process, optimizing reaction conditions, and ensuring the production of high-quality products in biocatalytic applications. For a comprehensive report around the technical key data of yield and conversion, see literature for further information, e.g. Lies _et al._3."
    slots:
      - has_c_yield
      - has_yield_unit
      - has_space_time_yield
      - has_space_time_yield_unit
      - has_conversion
      - has_conversion_unit
      - has_special_treatment

  # Sampling
  SamplePreprocessing:
    is_a: #todo Marc
    class_uri:
    description: "Sample preprocessing involves the necessary steps taken to prepare and treat collected samples before analysis or further experimentation."
    slots:
      - has_quenching_method
      - has_quenching_ratio
      - has_treatment_procedure
      - has_special_treatment
  SamplingDescription:
    is_a: #todo Marc
    class_uri:
    description: "Information about the sampling process, used during the experiment. In some experiments no sampling is taking place at all, for example, if an experiment is monitored via a photospectrometer in a 96-well plate over time."
    slots:
      - has_volume_per_sample
      - has_volume_per_sample_unit
      - has_mixing_during_sampling
      - has_vessel_opened_for_sampling
      - has_gas_phase
      - has_time
  SamplingFromHeterogeneousReactionSolutions:
    is_a: #todo Marc
    class_uri:
    description: "Sample preprocessing"
    slots:
      - has_phase
      - has_biocatalyst_in_phase
      - has_special_treatment
  
  # Vessels and Mixing
  LiquidOrGasImpelledMixing:
    is_a: #todo Marc
    class_uri:
    description: "Detailed information about the mixing mode used, whether it involves liquid or gas impelled mixing, is essential for ensuring the reproducibility and understanding of enzymatic reactions."
    slots:
      - has_volume_of_liquid_solid_phase
      - has_residence_time
      - has_residence_time_unit
      - has_reynolds_number
      - has_passive_mixing
      - has_active_T_or_Y_mixer
      - has_pulsing
      - has_special_treatment
  MechanicallyImpelledMixing:
    is_a: #todo Marc
    class_uri:
    description: "When utilizing mechanically impelled mixing in enzymatic reactions, it is essential to provide information about the mixing method and related parameters.Liquid or gas impelled mixing"
    slots:
      - has_stirring_type
      - has_stirrer_material
      - has_supplier
      - has_number_of_stirrers
      - has_distance_between_stirrers
      - has_distance_between_stirrers_unit
      - has_stirrer_blade_pitch_angle
      - has_number_of_stirrer_blades
      - has_stirrer_blade_size
      - has_stirrer_blade_size_unit
      - has_stirrer_geometry
      - has_stirrer_speed
      - has_speed_unit
      - has_height_of_stirrer_above_vessel_base
      - has_height_of_stirrer_above_vessel_base_unit
      - has_power_per_volume
      - has_power_per_volume_unit
      - has_stir_bar_size
      - has_stir_bar_size_unit
      - has_stir_bar_shape
      - has_special_treatment
  Plate:
    is_a: #todo Marc
    class_uri:
    description: "It's crucial to provide detailed information about the plate type, material, well configuration, and other relevant specifications to ensure reproducibility and accuracy of the experimental setup.Stirred Tank Reactor"
    slots:
      - has_plate_type
      - has_plate_material
      - has_number_of_wells
      - has_well_shape
      - has_well_volume
      - has_well_arrangement
      - has_supplier
      - has_lot_number
      - has_sealing_method
      - has_sealing_material
      - has_special_treatment
  Shaking:
    is_a: #todo Marc
    class_uri:
    description: "Shaking is an essential method for ensuring uniform mixing and, consequently, recording relevant metadata is crucial for maintaining consistent reaction conditions.Mechanically impelled mixing (stirring)"
    slots:
      - has_shaking_type
      - has_deflection
      - has_deflection_unit
      - has_speed
      - has_speed_unit
      - has_position
      - has_special_treatment
  StirredTankReactor:
    is_a: #todo Marc
    class_uri:
    description: "Stirred Tank Reactors (STRs) are frequently employed as versatile and controlled vessels, allowing for precise regulation of key parameters like temperature, pH, and stirring speed. All relevant specifications or attributes need to be described.Tubular flow/continuous reactor"
    slots:
      - has_type
      - has_material
      - has_volume
      - has_volume_unit
      - has_geometry
      - has_bottom_type
      - has_gas_consumption
      - has_gas_supply
      - has_gas_supply_rate
      - has_gas_supply_rate_unit
      - has_temperature_control
      - has_special_treatment
  TubularFlowContinuousReactor:
    is_a: #todo Marc
    class_uri:
    description: "When conducting enzymatic reactions in tubular flow or continuous reactors, it is essential to provide detailed information about the reactor setup, e.g. plug flow reactor, and operating conditions to ensure reproducibility and transparency in reporting the experimental process."
    slots:
      - has_volume
      - has_volume_unit
      - has_geometry
      - has_reactor_type
      - has_material
      - has_tubing
      - has_localisation_of_the_catalyst
      - has_special_treatment
  Vial:
    is_a: #todo Marc
    class_uri: AFE:0000329
    description: "Vials are sealable containers available in various sizes and materials, playing a crucial role in sample storage and handling, as well as serving as reaction vessels.Plate"
    slots:
      - has_vial_size
      - has_vial_size_unit
      - has_vial_material
      - has_closure_type
      - has_special_treatment
slots:

  # BiocatalystPurchased
  has_name:
    slot_uri: # todo Marc
    description: "The name of the biocatalyst can be either generic based on the catalyzed reaction, for example, 'lipase' or more specifically by describing the genus and species, such as '"
  has_ec_number:
    slot_uri: # todo Marc
    description: "Numerical classification system that categorizes enzymes based on their biochemical function and reaction mechanism, such as EC 3.1.4.12."
  has_molecular_weight:
    slot_uri: # todo Marc
    description: "The molecular weight (MW) refer to the sum of the atomic weights of the atoms in a molecule and therefore describes the mass of an enzyme."
    range: float
  has_molecular_weight_unit:
    slot_uri: # todo Marc
    description: "The enzyme size or molar weight is typically expressed in kDa (kilodaltons)."
  has_catalyzed_reaction:
    slot_uri: # todo Marc
    description: "The reaction catalyzed by the biocatalyst."
  has_sequence_amino_acid:
    slot_uri: # todo Marc
    description: "The amino acid sequence of the biocatalyst. The amino acid sequence can be represented in either a three-letter or one-letter code. For instance, \"Ala-Ser-Gly\" corresponds to the three-letter code, while \"ASG\" represents the same sequence in the one-letter code. One of the databases commonly used for storing and retrieving amino acid sequences is the UniProt database (https://www.uniprot.org/). UniProt provides extensive information on protein sequences, including their one-letter and three-letter amino acid codes, allowing researchers to access and analyze various protein sequences."
  has_sequence_DNA:
    slot_uri: # todo Marc
    description: "The DNA sequence of the biocatalyst including any tags and linkers."
  has_origin_organism:
    slot_uri: # todo Marc
    description: "The specific species or source from which the enzyme is derived or isolated. It includes information about the genus and species of the organism. However, the cell type from which the biocatalyst is        derived could be bacterial, as well as plant, animal, or other sources. ("
  has_supplier:
    slot_uri: # todo Marc
    description: "Information about the supplier from which the enzyme was purchased. If possible, a reference for the purchased biocatalyst should also be provided."
  has_production_organism:
    slot_uri: # todo Marc
    description: "Information about the organism in which the biocatalyst was produced is crucial in the context of heterologous gene expression."
  has_posttranslational_modification:
    slot_uri: # todo Marc
    description: "Information about any chemical modifications or alterations that occur to the biocatalyst's protein structure after translation, such as phosphorylation, glycosylation, acetylation,               methylation, ubiquitination and other modifications."
  has_purity:
    slot_uri: # todo Marc
    description: "Purity of enzymes typically expressed in percentage (%). It is usually stated as the percentage of the pure enzyme or active component relative to the total mass of the enzyme preparation."
    range: float
  has_purity_specification:
    slot_uri: # todo Marc
    description: "Description of how the purity of the biocatalyst was determined. In case of purchased enzymes, this information is often available from the product specification sheet."
  has_formulation:
    slot_uri: # todo Marc
    description: "Depending on the formulation, the biocatalyst can exist either in a dissolved state within a solvent or as a solid powder. It defines the physical state in which the biocatalyst is used. Additional information regarding the application or formulation in the experiment should be entered in the next subcategory."

  # BiocatalystSelfProduced
  has_sequence_plasmid:
    slot_uri: # todo Marc
    description: "The DNA sequence of the plasmid used to produce the biocatalyst. The sequence can be provided in plain text or as a database ID."
  has_plasmid_specifications:
    slot_uri: # todo Marc
    description: "All DNA sequence changes (e.g. codon optimization for"
  has_purification_method:
    slot_uri: # todo Marc
    description: "The choice of purification methods is diverse and can impact the enzyme, with possible methods including chromatographic techniques, precipitation, HPLC, ultrafiltration, dialysis, salt fractionation,      etc."

  # CellFreeProduction
  has_source_of_cellfree_extract:
    slot_uri: # todo Marc
